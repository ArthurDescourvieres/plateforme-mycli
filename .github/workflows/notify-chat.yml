name: notify-chat

on:
  pull_request:
    types: [opened, closed]
  issues:
    types: [opened, closed]

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Post to Google Chat
        env:
          WEBHOOK: ${{ secrets.GOOGLE_CHAT_WEBHOOK }}
          KIND: ${{ github.event_name }}
          ACTION: ${{ github.event.action }}
          TITLE: ${{ github.event.pull_request.title || github.event.issue.title }}
          LINK: ${{ github.event.pull_request.html_url || github.event.issue.html_url }}
          WHO: ${{ github.event.sender.login }}
        run: |
          curl -sS -X POST "$WEBHOOK" \
            -H 'Content-Type: application/json' \
            --data "$(jq -n --arg t "$KIND $ACTION : $TITLE (par $WHO) - $LINK" '{text: $t}')"