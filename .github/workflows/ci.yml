name: CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  format-lint:
    name: Format and lint Go code
    defaults:
      run:
        shell: bash
        working-directory: cli

    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26.9'

      - name: Check gofmt
        run: test -z "$(gofmt -l .)"

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.12.2
          working-directory: cli

  dependencies:
    name: Check Go dependencies
    defaults:
      run:
        shell: bash
        working-directory: cli

    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26.9'
          cache: true

      - name: Verify Go dependencies
        run: go mod verify

      - name: Check Go modules
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      - name: Check vulnerabilities
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.8.0
          govulncheck ./...

  leaks:
    name: Detect leaked secrets
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Scan repository for secrets
        uses: gitleaks/gitleaks-action@v2

  test:
    name: Run tests
    needs: [format-lint, dependencies, leaks]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26.9'

      - name: Start MinIO and run tests
        run: make test

